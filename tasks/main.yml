---
- name: Installing andrewrothstein.git
  ansible.builtin.include_role:
    name: andrewrothstein.git

- name: Resolve platform specific vars
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_distribution }}-{{ ansible_distribution_release }}.yml'
        - '{{ ansible_distribution }}.yml'
        - '{{ ansible_os_family }}.yml'
      skip: true
      paths:
        - '{{ role_path }}/vars'
- name: Check for installation in {{ kpt_bin_exe }}
  become: true
  ansible.builtin.stat:
    path: '{{ kpt_bin_exe }}'
  changed_when: false
  register: kpt_binary
- name: Downloading and installing kpt
  when: not kpt_binary.stat.exists
  block:
    - name: Downloading {{ kpt_url }} to {{ kpt_tmp_archive }}
      become: true
      become_user: root
      ansible.builtin.get_url:
        url: '{{ kpt_url }}'
        dest: '{{ kpt_tmp_archive }}'
        checksum: '{{ kpt_checksum }}'
        mode: '644'
    - name: Mkdir {{ kpt_install_dir }}
      become: true
      become_user: root
      ansible.builtin.file:
        path: '{{ kpt_install_dir }}'
        state: directory
        mode: '755'
    - name: Installing andrewrothstein.unarchivedeps
      ansible.builtin.include_role:
        name: andrewrothstein.unarchivedeps
    - name: Unarchive {{ kpt_tmp_archive }} into {{ kpt_install_dir }}
      become: true
      become_user: root
      ansible.builtin.unarchive:
        src: '{{ kpt_tmp_archive }}'
        dest: '{{ kpt_install_dir }}'
        creates: '{{ kpt_bin_exe }}'
        remote_src: true
  always:
    - name: Rm -f {{ kpt_tmp_archive }}
      become: true
      become_user: root
      ansible.builtin.file:
        path: '{{ kpt_tmp_archive }}'
        state: absent
- name: Link {{ kpt_link_exe }} to {{ kpt_bin_exe }}
  become: true
  become_user: root
  ansible.builtin.file:
    src: '{{ kpt_bin_exe }}'
    dest: '{{ kpt_link_exe }}'
    state: link
